[project]
name = "pytest-triage"
version = "0.1.0"
description = "Shadow-mode triage agent for pytest-dev/pytest issues: labels, duplicates, missing info - measured against what maintainers actually did."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
triage = "pytest_triage.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# fastembed 0.9.0 caps pillow below 13, but 12.x has known CVEs and this project only
# uses fastembed's text models, never its image code. Drop once fastembed allows 13.
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # allow typographic characters in strings (em dashes in messages)
