# Lint, offline tests and the regression gate on every push and PR. No secrets, no network, no cost.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tag in the comment) so a moved tag can't change CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --ignore=tests/test_regression.py
      # Fails when a prompt, model or guard change hasn't been re-measured, or when
      # post-processing lowers the frozen dev scores. See src/pytest_triage/regression.py.
      - name: Regression gate
        run: uv run pytest -q tests/test_regression.py
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable
